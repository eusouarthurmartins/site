<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Interativo</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <!-- OG Image -->
    <meta property="og:title" content="Pesquisa de Perfil - Chat Interativo">
    <meta property="og:description" content="Descubra como ganhar dinheiro na internet com nossa pesquisa personalizada">
    <meta property="og:image" content="og-image.jpg">
    <meta property="og:url" content="https://suporteoficial.site/">
    <meta property="og:type" content="https://suporteoficial.site/">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pesquisa de Perfil - Chat Interativo">
    <meta name="twitter:description" content="Descubra como ganhar dinheiro na internet">
    <meta name="twitter:image" content="og-image.jpg">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Variáveis de cores */
        :root {
            --primary-dark: #0a2e1a;
            --primary-green: #1a5c3a;
            --accent-green: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.5);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --bg-chat: #0a1114;
            --bg-message-user: #005c4b;
            --bg-message-bot: #1e2d33;
            --border-color: #2a3942;
            --gradient-primary: linear-gradient(135deg, #1a5c3a, #00ff88);
            --gradient-dark: linear-gradient(180deg, #0a2e1a, #0a1114);
        }

        /* Reset e estilos base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--gradient-dark);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Efeito de partículas de fundo */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent-green);
            border-radius: 50%;
            opacity: 0;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }
            10% {
                opacity: 0.4;
            }
            90% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-100vh) scale(1.5);
            }
        }

        /* Container principal com efeitos */
        .chat-wrapper {
            position: relative;
            z-index: 1;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            max-height: 800px;
            background: rgba(10, 17, 20, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.7),
                0 0 100px rgba(0, 255, 136, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(0, 255, 136, 0.2);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header com logotipo */
        .chat-header {
            background: linear-gradient(135deg, var(--primary-dark), #0f1f1a);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .chat-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.2), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        .logo-container {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: var(--gradient-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        .logo-placeholder {
            color: white;
            font-size: 24px;
            font-weight: 700;
        }

        .header-info {
            flex: 1;
        }

        .header-name {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--accent-green);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.7;
            }
        }

        /* Área de chat */
        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            position: relative;
        }

        /* Estilo da barra de rolagem customizada */
        .chat-body::-webkit-scrollbar {
            width: 6px;
        }

        .chat-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-body::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent-green), var(--primary-green));
            border-radius: 3px;
        }

        /* Mensagens com efeitos aprimorados */
        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 20px;
            position: relative;
            animation: messageSlide 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transition: transform 0.2s ease;
        }

        .message:hover {
            transform: scale(1.02);
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message.bot {
            background: linear-gradient(135deg, rgba(30, 45, 51, 0.9), rgba(30, 45, 51, 0.7));
            align-self: flex-start;
            border-bottom-left-radius: 8px;
            box-shadow: 
                0 4px 15px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .message.user {
            background: linear-gradient(135deg, rgba(0, 92, 75, 0.9), rgba(0, 92, 75, 0.7));
            align-self: flex-end;
            border-bottom-right-radius: 8px;
            box-shadow: 
                0 4px 15px rgba(0, 255, 136, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Animação de digitação melhorada */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 16px 20px;
            background: linear-gradient(135deg, rgba(30, 45, 51, 0.9), rgba(30, 45, 51, 0.7));
            border-radius: 20px;
            border-bottom-left-radius: 8px;
            width: fit-content;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .typing-dot {
            width: 10px;
            height: 10px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingBounce {
            0%, 60%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0.7;
            }
            30% {
                transform: translateY(-12px) scale(1.2);
                opacity: 1;
            }
        }

        /* Botões de resposta com efeitos */
        .response-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 15px;
            width: 100%;
        }

        .response-button {
            padding: 12px 20px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 25px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 14px;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .response-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, var(--accent-glow), transparent);
            transition: all 0.5s ease;
            transform: translate(-50%, -50%);
        }

        .response-button:hover {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 255, 136, 0.1));
            border-color: var(--accent-green);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 
                0 8px 25px rgba(0, 255, 136, 0.3),
                0 0 20px rgba(0, 255, 136, 0.2);
        }

        .response-button:hover::before {
            width: 100%;
            height: 100%;
        }

        .response-button:active {
            transform: translateY(-1px) scale(1.02);
        }

        /* Input de WhatsApp com efeitos */
        .whatsapp-input-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
            width: 100%;
        }

        .whatsapp-input {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-radius: 25px;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .whatsapp-input:focus {
            border-color: var(--accent-green);
            box-shadow: 
                0 0 20px rgba(0, 255, 136, 0.3),
                inset 0 0 10px rgba(0, 255, 136, 0.1);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.08));
        }

        .whatsapp-input::placeholder {
            color: var(--text-secondary);
        }

        .submit-button {
            padding: 14px 30px;
            background: linear-gradient(135deg, var(--primary-green), var(--accent-green));
            border: none;
            border-radius: 25px;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            align-self: flex-end;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .submit-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .submit-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 
                0 10px 30px rgba(0, 255, 136, 0.4),
                0 0 30px rgba(0, 255, 136, 0.3);
        }

        .submit-button:hover::before {
            left: 100%;
        }

        .submit-button:active {
            transform: translateY(-1px) scale(1.02);
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Tela de sucesso com efeitos */
        .success-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--bg-chat), rgba(10, 46, 26, 0.95));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .success-screen.active {
            opacity: 1;
            visibility: visible;
        }

        .success-icon {
            font-size: 80px;
            color: var(--accent-green);
            margin-bottom: 25px;
            animation: successPulse 1s ease-out;
            text-shadow: 0 0 30px var(--accent-glow);
        }

        @keyframes successPulse {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.2) rotate(180deg);
            }
            100% {
                transform: scale(1) rotate(360deg);
                opacity: 1;
            }
        }

        .success-message {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .success-submessage {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 35px;
            text-align: center;
        }

        .success-button {
            padding: 16px 40px;
            background: linear-gradient(135deg, var(--primary-green), var(--accent-green));
            border: none;
            border-radius: 30px;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 17px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .success-button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent);
            transition: all 0.5s ease;
            transform: translate(-50%, -50%);
        }

        .success-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 
                0 15px 40px rgba(0, 255, 136, 0.5),
                0 0 40px rgba(0, 255, 136, 0.3);
        }

        .success-button:hover::after {
            width: 300px;
            height: 300px;
        }

        /* Responsividade aprimorada */
        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            .chat-container {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }

            .message {
                max-width: 85%;
            }

            .chat-header {
                padding: 15px;
            }

            .logo-container {
                width: 45px;
                height: 45px;
            }

            .header-name {
                font-size: 16px;
            }
        }

        /* Efeito de brilho no hover do container */
        .chat-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--accent-green), transparent, var(--primary-green));
            border-radius: 24px;
            opacity: 0;
            z-index: -1;
            transition: opacity 0.3s ease;
            animation: borderRotate 3s linear infinite;
        }

        @keyframes borderRotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .chat-container:hover::before {
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <!-- Partículas de fundo -->
    <div class="particles" id="particles"></div>

    <!-- Container principal -->
    <div class="chat-wrapper">
        <div class="chat-container">
            <!-- Header com logotipo -->
            <div class="chat-header">
                <div class="logo-container">
                    <!-- Substitua este placeholder pelo seu logotipo -->
                    <img src="logo.png" alt="Logo" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px; display: none;" id="logoImage">
                    <div class="logo-placeholder" id="logoPlaceholder">
                        <i class="fas fa-rocket"></i>
                    </div>
                </div>
                <div class="header-info">
                    <div class="header-name">Assistente de Pesquisa</div>
                    <div class="header-status">
                        <div class="status-dot"></div>
                        <span>Online agora</span>
                    </div>
                </div>
            </div>

            <!-- Área de chat -->
            <div class="chat-body" id="chatBody">
                <!-- As mensagens serão inseridas aqui via JavaScript -->
            </div>

            <!-- Tela de sucesso -->
            <div class="success-screen" id="successScreen">
                <div class="success-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="success-message">Perfeito!</div>
                <div class="success-submessage">Seu acesso está sendo preparado.</div>
                <button class="success-button" id="accessButton">Acessar agora</button>
            </div>
        </div>
    </div>

    <script>
        // Elementos do DOM
        const chatBody = document.getElementById('chatBody');
        const successScreen = document.getElementById('successScreen');
        const accessButton = document.getElementById('accessButton');
        const logoImage = document.getElementById('logoImage');
        const logoPlaceholder = document.getElementById('logoPlaceholder');

        // Criar partículas de fundo
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Carregar logotipo
        function loadLogo() {
            logoImage.onerror = function() {
                logoPlaceholder.style.display = 'flex';
                logoImage.style.display = 'none';
            };
            
            logoImage.onload = function() {
                logoPlaceholder.style.display = 'none';
                logoImage.style.display = 'block';
            };
            
            // Tenta carregar o logotipo
            logoImage.src = 'logo.png';
        }

        // Dados da conversa
        const conversationFlow = [
            {
                botMessage: "Olá! 👋\nEstou fazendo uma pesquisa rápida para entender melhor pessoas que querem ganhar dinheiro com internet.\nPosso te fazer algumas perguntas rápidas?",
                options: ["Sim", "Claro"]
            },
            {
                botMessage: "Hoje você já trabalha com internet?",
                options: ["Sim, já trabalho", "Estou começando agora", "Ainda não sei por onde começar"]
            },
            {
                botMessage: "Qual dessas opções mais combina com você hoje?",
                options: ["Quero vender como afiliado", "Quero criar meu próprio produto", "Quero aprender primeiro"]
            },
            {
                botMessage: "Se tudo desse certo, quanto você gostaria de ganhar por mês com a internet?",
                options: ["R$3.000 a R$5.000", "R$5.000 a R$10.000", "R$10.000+"]
            },
            {
                botMessage: "Quanto tempo por dia você poderia dedicar para trabalhar online?",
                options: ["1 a 2 horas", "2 a 4 horas", "Mais de 4 horas"]
            },
            {
                botMessage: "Perfeito! Com base nas suas respostas, posso te enviar um material que explica como começar.",
                isFinal: true
            }
        ];

        // Estado da conversa
        let currentStep = 0;
        let userResponses = [];
        let userData = {
            whatsapp: '',
            timestamp: new Date().toISOString(),
            userAgent: navigator.userAgent,
            ip: '' // Será preenchido pela API
        };

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            loadLogo();
            // Obter IP do usuário
            getUserIP();
            setTimeout(() => {
                startConversation();
            }, 1500);
        });

        // Função para obter o IP do usuário
        async function getUserIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                userData.ip = data.ip;
            } catch (error) {
                console.error('Erro ao obter IP:', error);
            }
        }

        // Função para iniciar a conversa
        function startConversation() {
            showTypingIndicator();
            setTimeout(() => {
                hideTypingIndicator();
                showMessage(conversationFlow[0].botMessage, 'bot');
                setTimeout(() => {
                    showResponseButtons(conversationFlow[0].options);
                }, 600);
            }, 1800);
        }

        // Mostrar indicador de digitação
        function showTypingIndicator() {
            const typingIndicator = document.createElement('div');
            typingIndicator.className = 'typing-indicator';
            typingIndicator.id = 'typingIndicator';
            typingIndicator.innerHTML = `
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            `;
            chatBody.appendChild(typingIndicator);
            scrollToBottom();
        }

        // Esconder indicador de digitação
        function hideTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        // Mostrar mensagem com efeito
        function showMessage(text, sender) {
            const message = document.createElement('div');
            message.className = `message ${sender}`;
            message.textContent = text;
            chatBody.appendChild(message);
            scrollToBottom();
            
            // Adicionar efeito de brilho temporário
            setTimeout(() => {
                message.style.boxShadow = sender === 'user' 
                    ? '0 4px 20px rgba(0, 255, 136, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2)'
                    : '0 4px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2)';
            }, 100);
        }

        // Mostrar botões de resposta
        function showResponseButtons(options) {
            const buttonsContainer = document.createElement('div');
            buttonsContainer.className = 'response-buttons';
            
            options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'response-button';
                button.textContent = option;
                button.style.animationDelay = `${index * 0.1}s`;
                button.addEventListener('click', () => handleUserResponse(option));
                buttonsContainer.appendChild(button);
            });
            
            chatBody.appendChild(buttonsContainer);
            scrollToBottom();
        }

        // Lidar com resposta do usuário
        function handleUserResponse(response) {
            // Salvar resposta
            userResponses.push(response);
            
            // Mostrar resposta do usuário
            showMessage(response, 'user');
            
            // Remover botões de resposta
            const buttonsContainer = document.querySelector('.response-buttons');
            if (buttonsContainer) {
                buttonsContainer.style.opacity = '0';
                buttonsContainer.style.transform = 'scale(0.8)';
                setTimeout(() => buttonsContainer.remove(), 300);
            }
            
            // Avançar para o próximo passo
            currentStep++;
            
            // Verificar se é o último passo
            if (currentStep < conversationFlow.length) {
                // Mostrar indicador de digitação
                showTypingIndicator();
                
                // Simular tempo de digitação
                setTimeout(() => {
                    hideTypingIndicator();
                    
                    // Verificar se é a pergunta final
                    if (conversationFlow[currentStep].isFinal) {
                        showMessage(conversationFlow[currentStep].botMessage, 'bot');
                        setTimeout(() => {
                            showWhatsAppInput();
                        }, 600);
                    } else {
                        showMessage(conversationFlow[currentStep].botMessage, 'bot');
                        setTimeout(() => {
                            showResponseButtons(conversationFlow[currentStep].options);
                        }, 600);
                    }
                }, 1200 + Math.random() * 800);
            }
        }

        // Mostrar campo de input para WhatsApp
        function showWhatsAppInput() {
            const inputContainer = document.createElement('div');
            inputContainer.className = 'whatsapp-input-container';
            inputContainer.innerHTML = `
                <input type="text" class="whatsapp-input" id="whatsappInput" placeholder="Digite seu WhatsApp para receber o acesso." maxlength="15">
                <button class="submit-button" id="submitButton">Receber acesso</button>
            `;
            chatBody.appendChild(inputContainer);
            scrollToBottom();
            
            // Focar no input
            setTimeout(() => {
                document.getElementById('whatsappInput').focus();
            }, 300);
            
            // Adicionar evento de submit
            document.getElementById('submitButton').addEventListener('click', submitWhatsApp);
            document.getElementById('whatsappInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    submitWhatsApp();
                }
            });
        }

        // Enviar WhatsApp
        async function submitWhatsApp() {
            const whatsappInput = document.getElementById('whatsappInput');
            const whatsapp = whatsappInput.value.trim();
            
            // Validação do número de WhatsApp
            if (!whatsapp || whatsapp.length < 10) {
                whatsappInput.style.borderColor = '#ff4444';
                whatsappInput.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    whatsappInput.style.animation = '';
                    whatsappInput.style.borderColor = '';
                }, 500);
                whatsappInput.focus();
                return;
            }
            
            // Salvar o WhatsApp nos dados do usuário
            userData.whatsapp = whatsapp;
            
            // Desabilitar botão
            const submitButton = document.getElementById('submitButton');
            submitButton.disabled = true;
            submitButton.textContent = 'Enviando...';
            submitButton.style.background = 'linear-gradient(135deg, #666, #999)';
            
            try {
                // Enviar dados para o servidor
                await sendUserData();
                
                // Mostrar mensagem do usuário
                showMessage(whatsapp, 'user');
                
                // Mostrar tela de sucesso
                setTimeout(() => {
                    successScreen.classList.add('active');
                }, 1000);
            } catch (error) {
                console.error('Erro ao enviar dados:', error);
                
                // Reabilitar botão em caso de erro
                submitButton.disabled = false;
                submitButton.textContent = 'Receber acesso';
                submitButton.style.background = '';
                
                // Mostrar mensagem de erro
                showMessage('Ocorreu um erro ao enviar seus dados. Por favor, tente novamente.', 'bot');
            }
        }

        // Função para enviar dados do usuário para o servidor
        async function sendUserData() {
            // Preparar dados completos do usuário
            const completeUserData = {
                ...userData,
                responses: userResponses,
                formId: 'chat_interativo_pesquisa',
                source: window.location.href
            };
            
            // OPÇÃO 1: Enviar para um webhook (recomendado)
            // Substitua a URL abaixo pela sua URL de webhook
            const webhookUrl = 'https://hook.us2.make.com/kxi5ynma5wtcyo1h4mf77rhartxrbfod';
            
            try {
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(completeUserData)
                });
                
                if (!response.ok) {
                    throw new Error(`Erro na resposta: ${response.status}`);
                }
                
                return await response.json();
            } catch (error) {
                console.error('Erro ao enviar para webhook:', error);
                
                // OPÇÃO 2: Enviar para o Google Sheets (alternativa)
                // Você precisará configurar um Google Apps Script para receber esses dados
                // Veja como fazer isso em: https://github.com/levinunnink/html-form-to-google-sheet
                const googleSheetsUrl = 'https://script.google.com/macros/s/SEU_SCRIPT_ID/exec';
                
                try {
                    const response = await fetch(googleSheetsUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(completeUserData)
                    });
                    
                    if (!response.ok) {
                        throw new Error(`Erro na resposta do Google Sheets: ${response.status}`);
                    }
                    
                    return await response.json();
                } catch (gsError) {
                    console.error('Erro ao enviar para o Google Sheets:', gsError);
                    
                    // OPÇÃO 3: Enviar por e-mail usando EmailJS (alternativa)
                    // Você precisará configurar uma conta no EmailJS
                    // Veja como fazer isso em: https://www.emailjs.com/
                    try {
                        // Este é um exemplo de como seria a chamada para o EmailJS
                        // Você precisará incluir a biblioteca do EmailJS no seu HTML
                        /*
                        emailjs.send('SEU_SERVICE_ID', 'SEU_TEMPLATE_ID', completeUserData)
                            .then(function(response) {
                                console.log('E-mail enviado com sucesso!', response.status, response.text);
                            }, function(error) {
                                console.log('Falha ao enviar e-mail...', error);
                            });
                        */
                        
                        // Se chegou aqui, todas as opções falharam
                        throw new Error('Não foi possível enviar os dados por nenhum dos métodos disponíveis');
                    } catch (emailError) {
                        console.error('Erro ao enviar por e-mail:', emailError);
                        throw emailError;
                    }
                }
            }
        }

        // Redirecionar ao clicar no botão de acesso
        accessButton.addEventListener('click', () => {
            // Redirecionar para o WhatsApp
            window.location.href = "https://wa.me/5522997301385";
            
            // Efeito de clique
            accessButton.style.transform = 'scale(0.95)';
            setTimeout(() => {
                accessButton.style.transform = '';
            }, 200);
        });

        // Função para rolar para o final do chat
        function scrollToBottom() {
            chatBody.scrollTo({
                top: chatBody.scrollHeight,
                behavior: 'smooth'
            });
        }

        // Formatar input de WhatsApp
        document.addEventListener('input', (e) => {
            if (e.target && e.target.id === 'whatsappInput') {
                let value = e.target.value.replace(/\D/g, '');
                
                // Aplicar formatação (XX) XXXXX-XXXX
                if (value.length > 0) {
                    if (value.length <= 2) {
                        value = `(${value}`;
                    } else if (value.length <= 7) {
                        value = `(${value.slice(0, 2)}) ${value.slice(2)}`;
                    } else {
                        value = `(${value.slice(0, 2)}) ${value.slice(2, 7)}-${value.slice(7, 11)}`;
                    }
                }
                
                e.target.value = value;
            }
        });

        // Adicionar efeito de shake para erros
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                20%, 40%, 60%, 80% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
